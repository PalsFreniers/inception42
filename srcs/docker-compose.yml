volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/tdelage/data/mariadb
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/tdelage/data/wordpress
      o: bind

networks:
  inception:

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file:
      - ../.env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - ./requirements/nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ./requirements/nginx/servers:/etc/nginx/conf.d
      - wordpress_data:/var/www/wordpress
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    env_file:
      - ../.env
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
      - ./requirements/wordpress/config/php.conf:/etc/php/7.4/fpm/pool.d/www.conf
